# 로컬 개발용 PostgreSQL — docker compose up -d
# 맥에 PostgreSQL 이 이미 설치돼 5432 를 쓰는 경우가 많아 5433 으로 연다
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uzustay
    ports:
      - '5433:5432'
    volumes:
      - uzustay-db:/var/lib/postgresql/data
volumes:
  uzustay-db:
